<style>
  :root{ --cream:#F8F4EC; --paper:#FFFDF8; --ink:#2A2622; --sub:#5C544B; --line:#E4DCCB;
    --steel:#2E6A8E; --green:#3D7E5F; --amber:#BD8A2A; --copper:#C0492E; --plum:#8A5A7A;
    --night:#0d1018; --panel:#171d29; --panel2:#1f2735; --edge:#313c53;
    --neonA:#f0b558; --neonC:#7fd6e8; --neonG:#6ee3a0; --neonR:#e87060; --txt:#e9e4d8; --dim:#98a1b8; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--night);color:var(--txt);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px;line-height:1.55;
       background-image:radial-gradient(ellipse at 50% -10%, #1a2231 0%, #0d1018 62%);min-height:100vh}
  .estic-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px clamp(14px,3vw,26px);background:var(--paper);border-bottom:1px solid var(--line);color:var(--ink)}
  .estic-bar .logo{width:26px;height:32px;flex:none;object-fit:contain}
  .estic-bar .who{font-weight:800;font-size:14px}
  .estic-bar .meta{font-size:12px;color:var(--sub);font-family:'JetBrains Mono',monospace}
  .estic-bar .rt{margin-left:auto;font-size:11px;color:var(--sub);font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.3}
  .wrap{max-width:940px;margin:0 auto;padding:16px clamp(12px,4vw,26px) 80px}

  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(23,29,41,.94);border:1px solid var(--edge);
       border-radius:14px;padding:9px 13px;margin-bottom:14px}
  .hud .lab{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .proofs{display:flex;gap:6px;flex-wrap:wrap}
  .proofs .p{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px dashed var(--edge);color:#4f5871;border-radius:16px;padding:4px 10px}
  .proofs .p.got{border:1px solid var(--neonG);color:var(--neonG);background:#16281f}
  .hud .rig{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim)}
  .hud .rig b{color:var(--neonA)}

  .stage{border:1px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.45)}
  .stage canvas{width:100%;height:auto;display:block}
  .chapter{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;color:var(--neonA);text-transform:uppercase;margin:16px 0 4px}
  .dlg{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:16px;padding:18px 20px;min-height:132px}
  .dlg .spk{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .dlg .spk.narr{color:var(--dim)} .dlg .spk.jos{color:var(--neonA)} .dlg .spk.tech{color:var(--neonC)} .dlg .spk.log{color:var(--neonG)}
  .dlg .txt{font-size:17px;color:#ded8ca}
  .dlg .txt .cur{color:var(--neonA)}
  .choices{display:grid;gap:9px;margin-top:14px}
  .choices button{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;text-align:left;background:#1b2231;border:1px solid var(--edge);
                  color:var(--txt);border-radius:11px;padding:13px 16px;cursor:pointer}
  .choices button:hover{border-color:var(--neonA);background:#222b3c}
  .choices button .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);display:block;margin-top:3px}
  .calcbox{background:#141a26;border:1px solid var(--edge);border-left:3px solid var(--neonC);border-radius:11px;padding:14px 16px;margin-top:14px}
  .calcbox .q{font-size:16px;margin-bottom:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .numin{font-family:'JetBrains Mono',monospace;font-size:16px;width:120px;padding:9px 11px;border:1px solid var(--edge);border-radius:8px;text-align:right;background:#111722;color:var(--txt);outline:none}
  .numin:focus{border-color:var(--neonC)}
  .unit{color:var(--dim)}
  .btn{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
       color:#0d1018;background:var(--neonC);border:none;border-radius:9px;padding:11px 17px;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:none;color:var(--dim);border:1px solid var(--edge)}
  .btn.ghost:hover{color:var(--txt);border-color:var(--neonA)}
  .btn.big{background:linear-gradient(90deg,var(--neonG),var(--neonC));font-size:15px;padding:14px 26px}
  .fb{font-family:'JetBrains Mono',monospace;font-size:14px;margin-top:9px;min-height:19px;color:var(--dim)}
  .fb.ok{color:var(--neonG)} .fb.no{color:var(--neonR)}
  .note{background:#231d2f;border:1px solid #453a5c;border-left:3px solid var(--plum);border-radius:10px;padding:11px 15px;margin-top:12px;font-size:15px;color:#ded3ea}
  .note b{color:#d0b6e8}
  .end{background:linear-gradient(160deg,#1d2432,#2a2130);border:1px solid var(--edge);border-radius:18px;padding:22px;margin-top:16px}
  .end h3{margin:0 0 8px;font-size:22px}
  .end .verdict{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
  .end .verdict.good{color:var(--neonG)} .end .verdict.bad{color:var(--neonR)} .end .verdict.mid{color:var(--neonA)}
  #calcToggle{position:fixed;right:16px;bottom:16px;z-index:40;width:54px;height:54px;border-radius:50%;border:1px solid var(--edge);background:var(--steel);color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  #calc{position:fixed;right:16px;bottom:80px;z-index:40;width:200px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:10px;display:none;color:var(--ink)}
  #calc.show{display:block}
  #calc .disp{font-family:'JetBrains Mono',monospace;font-size:20px;text-align:right;background:#F6F1E6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;min-height:40px;overflow:hidden;white-space:nowrap}
  #calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  #calc button{font-family:'JetBrains Mono',monospace;font-size:15px;padding:9px 0;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;color:var(--ink)}
  #calc button:hover{border-color:var(--steel)}
  #calc button.op{background:#eef3f6;color:var(--steel);font-weight:700}
  #calc button.eq{background:var(--green);color:#fff;font-weight:700}
  #calc button.cl{background:#fbeee9;color:var(--copper)}
  #calc .tt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);text-align:center;margin-top:6px}
  /* ---------- calculatrice scientifique (styles unifiés) ---------- */
  #calc{position:fixed;right:16px;bottom:80px;z-index:80;width:272px;background:#FFFDF8;border:1px solid #E4DCCB;
        border-radius:15px;box-shadow:0 14px 38px rgba(20,16,10,.35);padding:11px;display:none}
  #calc.show{display:block}
  #calc .scr{background:#F6F1E6;border:1px solid #E4DCCB;border-radius:9px;padding:7px 10px;margin-bottom:9px}
  #calc .scr .ex{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#5C544B;text-align:right;
                 min-height:17px;overflow:hidden;white-space:nowrap;direction:rtl}
  #calc .scr .rs{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;color:#2A2622;text-align:right;
                 min-height:30px;overflow:hidden;white-space:nowrap}
  #calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  #calc .keys button{font-family:'JetBrains Mono',monospace;font-size:14px;padding:9px 0;border:1px solid #E4DCCB;
                     border-radius:7px;background:#fff;cursor:pointer;color:#2A2622;line-height:1.1}
  #calc .keys button:hover{border-color:#2E6A8E;background:#f4f8fa}
  #calc .keys button:active{transform:translateY(1px)}
  #calc .keys .fn{background:#f4eef7;color:#8A5A7A;font-weight:700;font-size:11.5px}
  #calc .keys .op{background:#eaf1f5;color:#2E6A8E;font-weight:700;font-size:15px}
  #calc .keys .cl{background:#fbeee9;color:#C0492E;font-weight:700}
  #calc .keys .eq{background:#3D7E5F;color:#fff;font-weight:700;font-size:17px}
  #calc .keys .deg{background:#eef6f0;color:#3D7E5F;font-size:10.5px;letter-spacing:.04em}
  #calc .keys .deg.rad{background:#fdf6e6;color:#8a6313}
  #calc .tt{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#5C544B;text-align:center;margin-top:7px;opacity:.85}
</style>
</head>

<script>
"use strict";
var el=function(id){return document.getElementById(id);};
var numf=function(v){return parseFloat(String(v==null?'':v).replace(',','.'));};

/* ---------- calculatrice ---------- */
(function(){
  var expr='', last='', deg=true;
  var dE=document.getElementById('calcExpr'), dR=document.getElementById('calcRes');
  if(!dE||!dR) return;
  var D2R=Math.PI/180;
  function fmt(x){
    if(x===null||x===undefined||!isFinite(x)) return 'Err';
    var r=Math.round(x*1e10)/1e10;
    var s=(Math.abs(r)>=1e10||(Math.abs(r)<1e-6&&r!==0))? r.toExponential(6) : String(r);
    return s.replace('.',',');
  }
  /* --- tokenizer --- */
  var FN=['asin','acos','atan','sin','cos','tan','sqrt','ln','log','abs'];
  function tok(s){
    var T=[], i=0;
    while(i<s.length){
      var c=s[i];
      if(c===' '){ i++; continue; }
      if(c>='0'&&c<='9'||c==='.'){
        var j=i; while(j<s.length&&((s[j]>='0'&&s[j]<='9')||s[j]==='.')) j++;
        T.push({t:'num',v:parseFloat(s.slice(i,j))}); i=j; continue;
      }
      if(c==='\u03c0'){ T.push({t:'num',v:Math.PI}); i++; continue; }
      var got=null;
      for(var k=0;k<FN.length;k++){ if(s.startsWith(FN[k],i)){ got=FN[k]; break; } }
      if(got){ T.push({t:'fn',v:got}); i+=got.length; continue; }
      if('+-*/^()'.indexOf(c)>=0){ T.push({t:c}); i++; continue; }
      throw new Error('car');
    }
    return T;
  }
  /* --- parseur descendant --- */
  function parse(T){
    var p=0;
    function peek(){ return T[p]; }
    function eat(t){ if(T[p]&&T[p].t===t){ p++; return true; } return false; }
    function expression(){
      var v=term();
      while(T[p]&&(T[p].t==='+'||T[p].t==='-')){
        var op=T[p].t; p++;
        var r=term(); v=(op==='+')? v+r : v-r;
      }
      return v;
    }
    function term(){
      var v=power();
      while(T[p]&&(T[p].t==='*'||T[p].t==='/')){
        var op=T[p].t; p++;
        var r=power();
        if(op==='/'&&r===0) throw new Error('div0');
        v=(op==='*')? v*r : v/r;
      }
      return v;
    }
    function power(){
      var b=unary();
      if(T[p]&&T[p].t==='^'){ p++; var e=power(); return Math.pow(b,e); }
      return b;
    }
    function unary(){
      if(T[p]&&T[p].t==='-'){ p++; return -unary(); }
      if(T[p]&&T[p].t==='+'){ p++; return unary(); }
      return primary();
    }
    function primary(){
      var t=T[p];
      if(!t) throw new Error('fin');
      if(t.t==='num'){ p++; return t.v; }
      if(t.t==='fn'){
        p++;
        if(!eat('(')) throw new Error('par');
        var a=expression();
        if(!eat(')')) throw new Error('par');
        return applyFn(t.v,a);
      }
      if(t.t==='('){ p++; var v=expression(); if(!eat(')')) throw new Error('par'); return v; }
      throw new Error('tok');
    }
    var res=expression();
    if(p<T.length) throw new Error('reste');
    return res;
  }
  function applyFn(f,a){
    switch(f){
      case 'sin': return Math.sin(deg? a*D2R : a);
      case 'cos': return Math.cos(deg? a*D2R : a);
      case 'tan': return Math.tan(deg? a*D2R : a);
      case 'asin': if(a<-1||a>1) throw new Error('dom'); return deg? Math.asin(a)/D2R : Math.asin(a);
      case 'acos': if(a<-1||a>1) throw new Error('dom'); return deg? Math.acos(a)/D2R : Math.acos(a);
      case 'atan': return deg? Math.atan(a)/D2R : Math.atan(a);
      case 'sqrt': if(a<0) throw new Error('dom'); return Math.sqrt(a);
      case 'ln': if(a<=0) throw new Error('dom'); return Math.log(a);
      case 'log': if(a<=0) throw new Error('dom'); return Math.log(a)/Math.LN10;
      case 'abs': return Math.abs(a);
    }
    throw new Error('fn');
  }
  function evaluate(s){
    if(!s.trim()) return null;
    /* fermeture automatique des parenthèses ouvertes */
    var o=(s.match(/\(/g)||[]).length, c=(s.match(/\)/g)||[]).length;
    var full=s+')'.repeat(Math.max(0,o-c));
    return parse(tok(full));
  }
  function pretty(s){
    return s.replace(/\*/g,'\u00d7').replace(/\//g,'\u00f7')
            .replace(/sqrt\(/g,'\u221a(').replace(/\./g,',');
  }
  function render(){
    dE.textContent = expr? pretty(expr) : '\u00a0';
    var out='';
    try{ var v=evaluate(expr); out=(v===null)? '0' : fmt(v); }
    catch(e){ out=last||'\u00a0'; }
    dR.textContent=out;
  }
  function ins(s){ expr+=s; render(); }
  var host=document.getElementById('calc');
  document.getElementById('calcToggle').addEventListener('click',function(){ host.classList.toggle('show'); });
  host.addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    var a=b.dataset.act;
    if(a==='C'){ expr=''; last=''; render(); return; }
    if(a==='del'){ 
      var m=expr.match(/(asin|acos|atan|sqrt|sin|cos|tan|ln|log|abs)\($/);
      expr=m? expr.slice(0,-m[0].length) : expr.slice(0,-1);
      render(); return; }
    if(a==='deg'){ deg=!deg; b.textContent=deg?'DEG':'RAD'; b.classList.toggle('rad',!deg); render(); return; }
    if(a==='eq'){
      try{ var v=evaluate(expr); if(v===null) return;
        last=fmt(v); dR.textContent=last; expr=String(Math.round(v*1e10)/1e10); dE.textContent=pretty(expr); }
      catch(e){ dR.textContent='Err'; }
      return; }
    if(a==='neg'){
      var mm=expr.match(/(\d+\.?\d*)$/);
      if(mm){ expr=expr.slice(0,-mm[0].length)+'(-'+mm[0]+')'; }
      else { expr+='(-'; }
      render(); return; }
    ins(a);
  });
  render();
})();

    calcul('Vitesse moyenne de l\u2019AGV entre les deux balises : v = ?  <span style="color:var(--dim)">(m/s)</span>',
      function(v){ return Math.abs(v-3)<0.2; },
      '\u2713 3 m/s. La consigne du site est de 2 m/s.',
      '\u2717 Reprends : distance parcourue divis\u00e9e par la dur\u00e9e \u00e9coul\u00e9e entre les deux horodatages.',
      function(){
        proof('pv');
        say('','narr','Trois m\u00e8tres par seconde. La machine roulait <b>50 % plus vite</b> que la consigne annonc\u00e9e par Josserand. Naïma siffle entre ses dents et fait d\u00e9filer l\u2019\u00e9cran.',function(){
          note('\ud83d\udcc1 <b>Preuve 1 \u2014 vitesse r\u00e9elle : 3 m/s</b> (au lieu de 2 m/s). La version de l\u2019exploitant vient de perdre un pilier.');
          choices([
            {t:'\ud83e\uddee V\u00e9rifier cette vitesse par le freinage', sub:'recouper avec les traces au sol', go:SC.c3},
            {t:'\u2192 Passer directement au journal du capteur', sub:'plus rapide, moins solide', go:function(){
              loseRig(6);
              note('\u26a0 <b>Rigueur \u22126 %</b> : une mesure unique ne fait pas une preuve. Un expert recoupe toujours.');
              SC.c4();
            }}
          ]);
        });
      });
  });
};

SC.c3=function(){
  DECOR='atelier'; chap('Chapitre 3 \u00b7 L\u2019atelier');
  say('Naïma, technicienne maintenance','tech','\u00ab Le freinage d\u2019urgence de ce mod\u00e8le est brid\u00e9 \u00e0 <b>0,5 m/s\u00b2</b>, c\u2019est \u00e9crit dans la doc et je l\u2019ai v\u00e9rifi\u00e9 au banc la semaine derni\u00e8re : le frein va parfaitement bien. Vous avez mesur\u00e9 combien, la trace ? Neuf m\u00e8tres ? \u00bb',function(){
    calcul('Avec une trace de 9 m et une d\u00e9c\u00e9l\u00e9ration de 0,5 m/s\u00b2, quelle \u00e9tait la vitesse au d\u00e9but du freinage ?  <span style="color:var(--dim)">(m/s)</span>',
      function(v){ return Math.abs(v-3)<0.25; },
      '\u2713 3 m/s \u2014 exactement la vitesse trouv\u00e9e aux balises. Les deux mesures se recoupent.',
      '\u2717 Pense \u00e0 la relation entre vitesse, d\u00e9c\u00e9l\u00e9ration et distance d\u2019arr\u00eat : d = v\u00b2/(2a).',
      function(){
        proof('pf');
        say('','narr','Deux chemins ind\u00e9pendants, un seul r\u00e9sultat : <b>3 m/s</b>. Le frein a fait son travail \u2014 il a m\u00eame parfaitement respect\u00e9 sa fiche technique. Ce n\u2019est pas lui, le coupable.',function(){
          note('\ud83d\udcc1 <b>Preuve 2 \u2014 le freinage est conforme</b> : 9 m \u00e0 0,5 m/s\u00b2 correspondent bien \u00e0 un d\u00e9part \u00e0 3 m/s.');
          choices([{t:'\u2192 Ouvrir le journal du capteur avant', go:SC.c4}]);
        });
      });
  });
};

SC.c4=function(){
  DECOR='controle'; chap('Chapitre 4 \u00b7 Le journal du capteur');
  say('Naïma, technicienne maintenance','tech','\u00ab Voil\u00e0 la ligne qui vous int\u00e9resse. Le t\u00e9l\u00e9m\u00e8tre a bien vu le rack : d\u00e9tection \u00e0 <b>12 m\u00e8tres</b>. Et le frein s\u2019est d\u00e9clench\u00e9 <b>1,5 seconde</b> plus tard \u2014 c\u2019est le temps de traitement normal, il est dans les specs lui aussi. \u00bb',function(){
    calcul('\u00c0 3 m/s, quelle distance l\u2019AGV parcourt-il pendant cette seconde et demie de r\u00e9action ?  <span style="color:var(--dim)">(m)</span>',
      function(v){ return Math.abs(v-4.5)<0.3; },
      '\u2713 4,5 m avant m\u00eame de commencer \u00e0 freiner.',
      '\u2717 Pendant la r\u00e9action, la vitesse ne change pas encore : c\u2019est un mouvement uniforme.',
      function(){
        proof('pr');
        say('','narr','Tu poses l\u2019addition sur le coin de l\u2019\u00e9cran : 4,5 m\u00e8tres de r\u00e9action, puis 9 m\u00e8tres de freinage. Total : <b>13,5 m\u00e8tres</b> pour s\u2019arr\u00eater. Le rack \u00e9tait \u00e0 12. La collision \u00e9tait <b>math\u00e9matiquement in\u00e9vitable</b> \u2014 le capteur avait pourtant tout vu, et \u00e0 temps.',function(){
          note('\ud83d\udcc1 <b>Preuve 3 \u2014 distance d\u2019arr\u00eat totale : 13,5 m &gt; 12 m</b>. Ni le capteur ni le frein n\u2019ont failli : c\u2019est la VITESSE qui a rendu l\u2019arr\u00eat impossible.');
          choices([
            {t:'\ud83e\uddee Et si l\u2019AGV avait roul\u00e9 \u00e0 la consigne de 2 m/s ?', sub:'la question qui tue', go:SC.c5},
            {t:'\u2192 Assez calcul\u00e9 : r\u00e9diger le rapport', go:SC.fin}
          ]);
        });
      });
  });
};

SC.c5=function(){
  DECOR='virage'; chap('Chapitre 5 \u00b7 La contre-\u00e9preuve');
  say('','narr','Tu refais tout le trajet \u00e0 la vitesse r\u00e9glementaire. R\u00e9action : 2 \u00d7 1,5 = 3 m\u00e8tres. Freinage : 2\u00b2/(2 \u00d7 0,5) = 4 m\u00e8tres. Total : <b>7 m\u00e8tres</b>. Sur les 12 disponibles, l\u2019AGV se serait immobilis\u00e9 avec cinq m\u00e8tres de marge.',function(){
    calcul('La vitesse a augment\u00e9 de moiti\u00e9 (2 \u2192 3 m/s). De combien la SEULE distance de freinage a-t-elle \u00e9t\u00e9 multipli\u00e9e ? <span style="color:var(--dim)">(sans unit\u00e9)</span>',
      function(v){ return Math.abs(v-2.25)<0.12; },
      '\u2713 \u00d72,25 : parce que la distance de freinage d\u00e9pend du CARR\u00c9 de la vitesse.',
      '\u2717 Compare 4 m et 9 m. Et souviens-toi : d = v\u00b2/(2a) \u2014 le v est au carr\u00e9.',
      function(){
        proof('pw');
        say('Naïma, technicienne maintenance','tech','\u00ab \u00c0 une fois et demie la vitesse, presque deux fois et quart la distance de freinage\u2026 C\u2019est pour \u00e7a que la consigne \u00e9tait \u00e0 2. Restait \u00e0 savoir qui l\u2019a mont\u00e9e \u00e0 3. \u00bb  \u2014 Elle ouvre l\u2019historique des param\u00e8tres. Une seule ligne modifi\u00e9e, il y a onze jours, lors d\u2019une intervention pour \u00ab am\u00e9liorer la cadence \u00bb. Sign\u00e9e du bureau d\u2019exploitation.',function(){
          note('\ud83d\udcc1 <b>Preuve 4 \u2014 la cause racine</b> : le param\u00e8tre de vitesse a \u00e9t\u00e9 relev\u00e9 de 2 \u00e0 3 m/s sans recalculer la distance d\u2019arr\u00eat. Le syst\u00e8me de s\u00e9curit\u00e9 avait \u00e9t\u00e9 dimensionn\u00e9 pour 2 m/s.');
          choices([{t:'\u2192 R\u00e9diger le rapport d\u2019expertise', go:SC.fin}]);
        });
      });
  });
};

SC.fin=function(){
  DECOR='bureau'; chap('\u00c9pilogue \u00b7 Le rapport');
  say('','narr','06 h 15. La page est blanche, le caf\u00e9 est froid, et il faut conclure. Une seule ligne compte : la cause de l\u2019accident. Choisis \u2014 tu la d\u00e9fendras devant l\u2019inspection du travail.',function(){
    choices([
      {t:'\u00ab D\u00e9faillance du capteur avant \u00bb', sub:'la version de l\u2019exploitant', go:function(){ SC.verdict('capteur'); }},
      {t:'\u00ab D\u00e9faillance du syst\u00e8me de freinage \u00bb', sub:'l\u2019\u00e9pave est spectaculaire', go:function(){ SC.verdict('frein'); }},
      {t:'\u00ab Param\u00e8tre de vitesse relev\u00e9 sans recalcul de la distance d\u2019arr\u00eat \u00bb', sub:'ce que disent les chiffres', go:function(){ SC.verdict('vitesse'); }},
      {t:'\u00ab Cause ind\u00e9termin\u00e9e \u00bb', sub:'ne pas se mouiller', go:function(){ SC.verdict('rien'); }}
    ]);
  });
};

SC.verdict=function(kind){
  var n=nProofs(), box=el('extra');
  var titre, cls, corps;
  if(kind==='vitesse'&&n>=3){
    cls='good'; titre='\ud83c\udfaf Rapport retenu \u2014 et cause racine identifi\u00e9e';
    corps='L\u2019inspection valide ton rapport point par point : deux mesures ind\u00e9pendantes donnant 3 m/s, une distance d\u2019arr\u00eat de 13,5 m sup\u00e9rieure aux 12 m disponibles, et un param\u00e8tre modifi\u00e9 sans \u00e9tude. Le site abaisse la consigne \u00e0 2 m/s et impose d\u00e9sormais un recalcul de la distance d\u2019arr\u00eat \u00e0 chaque changement de vitesse. <b>Ni le capteur ni le frein n\u2019\u00e9taient en cause : c\u2019est la cin\u00e9matique qui a tranch\u00e9.</b>';
  } else if(kind==='vitesse'){
    cls='mid'; titre='\u26a0 Bonne intuition, dossier trop mince';
    corps='Tu vises juste, mais tu n\u2019as pas r\u00e9uni assez de mesures pour l\u2019\u00e9tablir. L\u2019exploitant conteste, et faute de recoupement, le dossier repart en contre-expertise. En m\u00e9canique comme au tribunal : une affirmation sans mesure ne p\u00e8se rien.';
  } else if(kind==='capteur'){
    cls='bad'; titre='\u2717 Rapport invalid\u00e9';
    corps='Le t\u00e9l\u00e9m\u00e8tre est d\u00e9mont\u00e9, test\u00e9\u2026 et parfaitement fonctionnel : il avait d\u00e9tect\u00e9 l\u2019obstacle \u00e0 12 m, comme pr\u00e9vu. Le journal le prouvait d\u00e9j\u00e0. Un capteur neuf est install\u00e9, la vitesse reste \u00e0 3 m/s \u2014 et six semaines plus tard, un second AGV percute un rack. Cette fois, quelqu\u2019un travaillait dans l\u2019allée.';
  } else if(kind==='frein'){
    cls='bad'; titre='\u2717 Rapport invalid\u00e9';
    corps='Le banc d\u2019essai est formel : le freinage d\u00e9veloppe exactement les 0,5 m/s\u00b2 de sa fiche technique \u2014 tes propres 9 m\u00e8tres de trace le confirmaient. Le frein est remplac\u00e9 pour rien, la vraie cause reste en place, et le risque avec elle.';
  } else {
    cls='bad'; titre='\u2717 Non-lieu \u2014 et machine remise en service';
    corps='Sans conclusion, l\u2019AGV repart le lendemain avec le m\u00eame param\u00e8tre de vitesse. Tu avais pourtant tout ce qu\u2019il fallait : quelques divisions, une distance d\u2019arr\u00eat, et le courage de contredire un chef de quai.';
  }
  box.innerHTML='<div class="end"><div class="verdict '+cls+'">'+(cls==='good'?'affaire r\u00e9solue':(cls==='mid'?'partiellement':'\u00e9chec'))+
    '</div><h3>'+titre+'</h3><p style="color:#cfc8ba">'+corps+'</p>'+
    '<p style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:var(--dim)">preuves r\u00e9unies : '+n+' / 4 \u00b7 rigueur : '+S.rig+' %</p>'+
    '<div class="note" style="margin-top:12px">\ud83d\udcd8 <b>Ce que tu viens d\u2019utiliser :</b> vitesse moyenne v = \u0394d/\u0394t \u00b7 distance d\u2019arr\u00eat d = v\u00b2/(2a) \u00b7 mouvement uniforme pendant le temps de r\u00e9action \u00b7 et la loi qui fait toute la diff\u00e9rence : <b>la distance de freinage cro\u00eet comme le CARR\u00c9 de la vitesse</b>.</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn big" id="again">\u21bb Reprendre l\u2019enqu\u00eate</button></div></div>';
  el('again').addEventListener('click',function(){
    S={ scene:'p0', proofs:{}, rig:100, t:S.t };
    ['pv','pf','pr','pw'].forEach(function(k){ el(k).classList.remove('got'); });
    el('rig').textContent='100'; el('extra').innerHTML='';
    SC.p0();
  });
  say('','narr','Tu signes. Dehors, le jour se l\u00e8ve sur les quais.');
};

SC.p0();
</script>
